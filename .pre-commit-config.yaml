# https://pre-commit.com — language-agnostic git hook framework.
# Bootstrap on a fresh clone:
#
#   pre-commit install --install-hooks
#
# Pre-commit hooks must stay fast (<5s on a small change). Heavy checks
# (full ESLint, full `go test`, type checking) run in `make ci` on
# pre-push instead, so the inner loop stays tight.

default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

# Generated or vendored artifacts — not ours to reformat. A fixer that
# "corrects" one of these fights the tool that writes it and the drift is
# back on the next regeneration, so the only thing it achieves is aborting
# the next push: pre-commit runs over the WHOLE tree when the branch being
# pushed has no remote counterpart, and every one of these paths was in
# that abort list.
exclude: |
  (?x)^(
    frontend-admin/public/css/.*|                    # sass output of src/assets/scss/{theme,user}.scss
    frontend-admin/src/assets/img/.*|                # vendored theme assets (svg + minified lottie json)
    frontend-admin/src/assets/json/.*|               # vendored map/geo data
    frontend-admin/src/components/wizard/lottie/.*|  # vendored lottie animations (minified json)
    frontend-admin/\.impeccable/.*|                  # tool-written cache and design data
    \.github/badges/.*\.svg                          # written by the coverage-badge bot, which runs no hooks
  )$

repos:
  # --- Generic hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$  # respect markdown trailing-space line breaks
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: |
          (?x)^(
            .*tsconfig.*\.json|         # tsconfig files allow JSONC (comments)
            frontend-admin/\.vscode/.*  # VSCode JSONC
          )$
      - id: check-added-large-files
        args: [--maxkb=500]
        # backend/openapi/enterprise.json is the canonical OpenAPI spec
        # for docs.orkestra.cc — regenerated by `make openapi-dump` and
        # gated by `make openapi-check`. Currently ~880 KB; documented
        # in backend/CLAUDE.md.
        exclude: ^backend/openapi/enterprise\.json$
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- Commit message: Conventional Commits --------------------------------
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # `merge` is the fork chain's own type: ADR-0010 return-merges and clone
        # syncs are subjects like `merge(upstream): …` / `merge(commons): …`.
        # The convention is used ~40 times in this history, but the hook never
        # ran on the private forks — their checkouts had no hooks installed —
        # so the contradiction stayed invisible until they did.
        args: [feat, fix, chore, docs, refactor, test, ci, build, perf, style, revert, merge]

  # --- Go (local hooks — use the mise-installed gofmt) ---------------------
  - repo: local
    hooks:
      - id: mcp-config-sync
        name: shared MCP configuration sync
        entry: python3 scripts/check-mcp-sync.py
        language: system
        files: ^(\.mcp\.json|\.codex/config\.toml|scripts/(check|test)-mcp-sync\.py)$
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: gofmt -w -l
        language: system
        files: ^backend/.*\.go$
        exclude: ^backend/.*\.(gen|pb)\.go$

      - id: go-mod-tidy
        name: go mod tidy (backend)
        entry: bash -c 'cd backend && go mod tidy'
        language: system
        files: ^backend/(go\.mod|go\.sum|.*\.go)$
        pass_filenames: false

  # --- Prettier (local — the repo's single prettier) ------------------------
  # NOT the pinned `mirrors-prettier` mirror this replaced. That mirror shipped
  # prettier 3.1.0 while frontend-admin installs 3.9.x, and the two versions
  # format union types differently: the mirror exploded them one-per-line and
  # the `prettier/prettier` rule inside eslint — which resolves the app's own
  # prettier — collapsed them back. The two hooks undid each other on every
  # run, so no commit could leave the tree clean; it is why theme.css kept
  # coming back dirty and had to be committed with --no-verify. Running the
  # binary from frontend-admin/node_modules puts exactly one version in charge,
  # the same one eslint loads. A hook's own `exclude` REPLACES the top-level
  # one rather than adding to it, so the generated/vendored list is repeated.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: frontend-admin/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^(frontend-admin|frontend-client)/.*\.(ts|tsx|js|jsx|json|md|yml|yaml|css|scss)$
        exclude: |
          (?x)^(
            (frontend-admin|frontend-client)/(dist|coverage|node_modules)/.*|
            frontend-admin/public/css/.*|
            frontend-admin/src/assets/img/.*|
            frontend-admin/src/assets/json/.*|
            frontend-admin/src/components/wizard/lottie/.*|
            frontend-admin/\.impeccable/.*
          )$

  # --- ESLint (local — needs each app's node_modules) ----------------------
  - repo: local
    hooks:
      - id: eslint-admin
        name: eslint (frontend-admin)
        entry: bash -c 'cd frontend-admin && npx eslint --max-warnings 0 --fix'
        language: system
        files: ^frontend-admin/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      - id: eslint-client
        name: eslint (frontend-client)
        entry: bash -c 'cd frontend-client && npm run lint -- --max-warnings 0 --fix'
        language: system
        files: ^frontend-client/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  # --- Dart (mobile) -------------------------------------------------------
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: bash -c 'cd mobile && dart format --set-exit-if-changed .'
        language: system
        files: ^mobile/.*\.dart$
        pass_filenames: false

  # --- Pre-push: full make ci for changed surfaces -------------------------
  - repo: local
    hooks:
      - id: make-ci
        name: make ci (changed surfaces)
        entry: make ci
        language: system
        stages: [pre-push]
        pass_filenames: false
