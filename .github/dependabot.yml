version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, go]

  - package-ecosystem: npm
    directory: /frontend-admin
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    # @fortawesome/* packages must move in lockstep — a lone bump (e.g.
    # free-regular ahead of svg-core) skews IconDefinition types and breaks
    # `tsc`. Group them so Dependabot always proposes them together.
    groups:
      fortawesome:
        patterns:
          - '@fortawesome/*'
      # Same lockstep rule, same reason: FullCalendar ships one version
      # across @fullcalendar/react + the plugin packages, and a lone bump
      # (react at 7 while daygrid/timegrid/list/interaction/bootstrap sit
      # at 6) fails `tsc` — see the closed #214.
      fullcalendar:
        patterns:
          - '@fullcalendar/*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]

  - package-ecosystem: pub
    directory: /mobile
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, flutter]

  # Added by the 2026-11 security audit: these manifests had no update source.
  - package-ecosystem: npm
    directory: /frontend-client
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, npm]

  # Base images are pinned to a version tag plus digest; this keeps the
  # digests moving. backend/ is left out on purpose: its dhi.io bases need
  # registry credentials Dependabot does not have, and are pinned to the Go
  # minor (patches arrive through orkestra.sh building with --pull). So is
# docker/Dockerfile.dev-backend, whose FROM is an ARG Dependabot cannot bump.
  - package-ecosystem: docker
    directories: [/frontend-admin, /frontend-client]
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
