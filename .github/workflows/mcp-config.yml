name: Agent configuration

on:
  pull_request:
    paths:
      - '.mcp.json'
      - '.codex/config.toml'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - 'scripts/check-mcp-sync.py'
      - 'scripts/test-mcp-sync.py'
      - 'scripts/check-agent-instructions.py'
      - 'scripts/test-agent-instructions.py'
      - '**/CLAUDE.md'
      - '**/CLAUDE.local.md'
      - '**/AGENTS.md'
      - '.github/workflows/mcp-config.yml'
  push:
    branches: [dev, main]
    paths:
      - '.mcp.json'
      - '.codex/config.toml'
      - '.pre-commit-config.yaml'
      - 'Makefile'
      - 'scripts/check-mcp-sync.py'
      - 'scripts/test-mcp-sync.py'
      - 'scripts/check-agent-instructions.py'
      - 'scripts/test-agent-instructions.py'
      - '**/CLAUDE.md'
      - '**/CLAUDE.local.md'
      - '**/AGENTS.md'
      - '.github/workflows/mcp-config.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify shared MCP configuration
        run: make ci-mcp
      - name: Verify AGENTS.md is the only instruction filename
        run: make ci-agents
