name: Frontend Admin CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'
  push:
    branches: [dev, main]
    # Release tags (vX.Y.Z) build versioned images. paths filters do not
    # apply to tag pushes, so a tag always triggers a full build + publish.
    tags:
      - 'v*'
    paths:
      - 'frontend-admin/**'
      - '.github/workflows/frontend-admin.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, whatever the repository or a fork sets as the default
# token permissions; a job that publishes widens it in its own permissions block.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install frontend toolchain only
        run: mise install node
      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci
      - name: Run frontend-admin CI (mirrors `make ci-frontend-admin` locally)
        run: make ci-frontend-admin
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-admin-coverage
          path: frontend-admin/coverage/
          retention-days: 7

  coverage-badge:
    name: Refresh coverage badge
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install frontend toolchain only
        run: mise install node
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-admin-coverage
          path: frontend-admin/coverage/
      - name: Refresh badge SVG
        run: scripts/refresh-coverage-badge.sh frontend-admin
      - name: Commit & push refreshed badge
        run: scripts/commit-coverage-badge.sh frontend-admin

  docker:
    name: Docker Build
    needs: ci
    # Publishes only where the CI_FULL repo variable is true (upstream +
    # commons). Product forks default to minimal CI — see AGENTS.md CI/CD.
    if: github.event_name == 'push' && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NOTE: GHCR image name stays at `frontend:*` for now to avoid stale
      # tag references in deployment manifests. PR 2 will dual-publish to
      # `frontend-admin:*` for a deprecation window, then drop the legacy
      # name. Do not rename here without coordinating that transition.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Image name stays `frontend` (see NOTE above) — not `frontend-admin`.
          images: ghcr.io/${{ github.repository }}/frontend
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend-admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # window.__ORKESTRA_CONFIG__ (apiUrl/wsUrl/env/debug) is populated
          # at *container start* from ORKESTRA_API_URL / ORKESTRA_WS_URL /
          # ORKESTRA_ENV / ORKESTRA_DEBUG by the nginx entrypoint — see
          # frontend-admin/Dockerfile + frontend-admin/public/config.js. The
          # only thing baked here is the application version, read by
          # Vite's `define` and surfaced in the SPA footer + /health.
          build-args: |
            ORKESTRA_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
