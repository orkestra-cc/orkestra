name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'
  push:
    branches: [dev, main]
    # Release tags (vX.Y.Z) build versioned images. paths filters do not
    # apply to tag pushes, so a tag always triggers a full build + publish.
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379
      COVERAGE_THRESHOLD: 15
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
      redis:
        image: redis/redis-stack-server:latest
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
      - name: Install backend toolchain only
        run: mise install go golangci-lint jq "go:golang.org/x/vuln/cmd/govulncheck"
      - name: Run backend CI (mirrors `make ci-backend` locally)
        run: make ci-backend
      - name: Enforce coverage threshold
        working-directory: backend
        run: |
          PCT=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%",""); print $NF}')
          echo "Coverage: ${PCT}%"
          awk -v p="$PCT" -v t="$COVERAGE_THRESHOLD" 'BEGIN { exit !(p+0 >= t+0) }' \
            || { echo "::error::Coverage ${PCT}% is below ${COVERAGE_THRESHOLD}% threshold"; exit 1; }
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7
      - name: Upload policy coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-coverage-report
          path: |
            backend/policy-coverage-report.md
            backend/policy-coverage-report.json
          retention-days: 7
        continue-on-error: true

  coverage-badge:
    name: Refresh coverage badge
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
      - name: Install backend toolchain only
        run: mise install go golangci-lint jq "go:golang.org/x/vuln/cmd/govulncheck"
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend/
      - name: Refresh badge SVG
        run: scripts/refresh-coverage-badge.sh backend
      - name: Commit & push refreshed badge
        run: scripts/commit-coverage-badge.sh backend

  docker:
    name: Docker Build
    needs: ci
    # Publishes only where the CI_FULL repo variable is true (upstream +
    # commons). Product forks default to minimal CI — see CLAUDE.md CI/CD.
    if: github.event_name == 'push' && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # Control `latest` explicitly below (flavor=auto would drop it on
          # dev pushes); keep the existing always-latest + full-sha tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-backend
          cache-to: type=gha,mode=max,scope=docker-backend
