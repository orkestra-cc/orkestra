name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'docker/docker-compose.infra.yml'
      - 'docker/docker-compose.dev.yml'
      - 'docker/docker-compose.staging.yml'
      - 'docker/docker-compose.prod.yml'
      - 'docker/docker-compose.retrieval.yml'
      - 'docker/mongo-init/**'
      - 'docker/tests/**'
      # make backend-cloudflare-tunnel checks the shipped routes examples
      - 'docker/cloudflared/**'
      # make backend-frontend-nginx serves these configs
      - 'docker/frontend-admin/**'
      - 'frontend-admin/Dockerfile'
      - 'frontend-client/Dockerfile'
      - '.github/workflows/backend.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'
      # make backend-script-tests / backend-credential-fallbacks
      - 'docker/.env.example'
      - 'scripts/init.sh'
      - 'scripts/env-file.sh'
      - 'scripts/env-validate.sh'
      - 'scripts/test-env-file.sh'
      - 'scripts/test-env-validate.sh'
      - 'orkestra.sh'
      - 'scripts/test-orkestra-helpers.sh'
      - 'docker/frontend-deps.sh'
  push:
    branches: [dev, main]
    # Release tags (vX.Y.Z) build versioned images. paths filters do not
    # apply to tag pushes, so a tag always triggers a full build + publish.
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'docker/docker-compose.infra.yml'
      - 'docker/docker-compose.dev.yml'
      - 'docker/docker-compose.staging.yml'
      - 'docker/docker-compose.prod.yml'
      - 'docker/docker-compose.retrieval.yml'
      - 'docker/mongo-init/**'
      - 'docker/tests/**'
      # make backend-cloudflare-tunnel checks the shipped routes examples
      - 'docker/cloudflared/**'
      # make backend-frontend-nginx serves these configs
      - 'docker/frontend-admin/**'
      - 'frontend-admin/Dockerfile'
      - 'frontend-client/Dockerfile'
      - '.github/workflows/backend.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
      - 'scripts/commit-coverage-badge.sh'
      # make backend-script-tests / backend-credential-fallbacks
      - 'docker/.env.example'
      - 'scripts/init.sh'
      - 'scripts/env-file.sh'
      - 'scripts/env-validate.sh'
      - 'scripts/test-env-file.sh'
      - 'scripts/test-env-validate.sh'
      - 'orkestra.sh'
      - 'scripts/test-orkestra-helpers.sh'
      - 'docker/frontend-deps.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, whatever the repository or a fork sets as the default
# token permissions; a job that publishes widens it in its own permissions block.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      # Unlocks the MONGO_TEST_URI-guarded repository/integration tests that
      # otherwise silently skip on every run.
      MONGO_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://localhost:6379
      # Consumed by `make ci-backend`'s coverage gate (Makefile: COVERAGE_THRESHOLD ?= 15).
      COVERAGE_THRESHOLD: 15
      # Unlock the retrieval driver conformance suite (ADR-0023 D3); without
      # them it skips and proves nothing.
      QDRANT_TEST_URL: http://localhost:6333
      QDRANT_TEST_API_KEY: ci-qdrant-test-key
    services:
      redis:
        # Same image and patch docker-compose.infra.yml pins — CI must test
        # the Redis the stacks run.
        image: redis:8.2.10-alpine
        ports: ['6379:6379']
      qdrant:
        # The engine floor of ADR-0023 (BM25 on the full-text index needs
        # 1.20); pinned by digest like the compose images.
        image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-test-key
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app uses MongoDB transactions, which a standalone mongod cannot
      # serve — so CI must run the same single-node replica set the compose
      # stacks do. A `services:` block cannot pass mongod flags, hence the
      # explicit `docker run`.
      # GLIBC_TUNABLES: on runners with Linux 6.19+ mongod 8.0 refuses to
      # start (SERVER-121912, TCMalloc's rseq use). Letting glibc own rseq
      # makes TCMalloc fall back to per-thread caches, which is safe on any
      # kernel; drop it once the pinned mongo recognises fixed kernels.
      - name: Start transaction-capable MongoDB
        run: |
          docker run --detach --name mongodb --publish 27017:27017 \
            --env GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            mongo:8.0.34 --replSet rs0 --bind_ip_all
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval 'db.runCommand({ping: 1}).ok' | grep -q '^1$'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs mongodb
              exit 1
            fi
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in {1..30}; do
            if docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q '^true$'; then
              exit 0
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs mongodb
              exit 1
            fi
            sleep 1
          done
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install backend toolchain only
        run: mise install go golangci-lint jq "go:golang.org/x/vuln/cmd/govulncheck"
      - name: Run backend CI (mirrors `make ci-backend` locally)
        run: make ci-backend
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7
      - name: Upload policy coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-coverage-report
          path: |
            backend/policy-coverage-report.md
            backend/policy-coverage-report.json
          retention-days: 7
        continue-on-error: true

  coverage-badge:
    name: Refresh coverage badge
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install backend toolchain only
        run: mise install go golangci-lint jq "go:golang.org/x/vuln/cmd/govulncheck"
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend/
      - name: Refresh badge SVG
        run: scripts/refresh-coverage-badge.sh backend
      - name: Commit & push refreshed badge
        run: scripts/commit-coverage-badge.sh backend

  docker:
    name: Docker Build
    needs: ci
    # Publishes only where the CI_FULL repo variable is true (upstream +
    # commons). Product forks default to minimal CI — see AGENTS.md CI/CD.
    if: github.event_name == 'push' && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/backend
          # Control `latest` explicitly below (flavor=auto would drop it on
          # dev pushes); keep the existing always-latest + full-sha tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-backend
          cache-to: type=gha,mode=max,scope=docker-backend
