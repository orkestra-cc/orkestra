name: Mobile CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
  push:
    branches: [dev, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
      - 'Makefile'
      - '.mise.toml'
      - 'scripts/refresh-coverage-badge.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, whatever the repository or a fork sets as the default
# token permissions; a job that publishes widens it in its own permissions block.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: true
      - name: Install mobile toolchain only
        run: mise install flutter
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run mobile CI (mirrors `make ci-mobile` locally)
        run: make ci-mobile
      - name: Run tests with coverage
        working-directory: mobile
        run: flutter test --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 7

  coverage-badge:
    name: Refresh coverage badge
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-coverage
          path: mobile/coverage/
      - name: Refresh badge SVG
        run: scripts/refresh-coverage-badge.sh mobile
      - name: Commit refreshed badge
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "chore(badges): refresh mobile coverage [skip ci]"
          file_pattern: .github/badges/mobile-coverage.svg

  build-android:
    name: Build Android
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: false
          cache: true
      - name: Install mobile toolchain only
        run: mise install flutter
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build APK
        working-directory: mobile
        run: flutter build apk -t lib/main_production.dart --release
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orkestra-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
