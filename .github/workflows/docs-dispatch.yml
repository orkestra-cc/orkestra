name: Docs Site Dispatch

# The sending half of the docs.orkestra.cc rebuild trigger. The receiving
# half already exists: orkestra-docs' build.yml listens for
# repository_dispatch types monorepo-docs-changed / monorepo-openapi-changed
# and mirrors this repo's docs/site tree at build time. Without this
# dispatch the site only rebuilds when someone runs its workflow by hand.

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/adr/**'
      - 'backend/openapi/enterprise.json'
  # Manual end-to-end test: sends monorepo-docs-changed unconditionally.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger docs.orkestra.cc rebuild
    # Upstream only: private chain forks carry this file but must never fire it.
    # This gate is also what keeps the hard failure below from breaking fork CI —
    # a fork has no DOCS_DISPATCH_TOKEN and never reaches these steps.
    if: github.repository == 'orkestra-cc/orkestra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: changed
        if: github.event_name == 'push'
        with:
          filters: |
            docs:
              - 'docs/site/**'
              - 'docs/adr/**'
            openapi:
              - 'backend/openapi/enterprise.json'

      # A missing token must break the run, not warn past it. This workflow
      # originally warned and exited 0: it reported success on every push to
      # main for two weeks while sending nothing, and the site kept serving a
      # build from before the workflow existed. A publish path that cannot
      # publish is a failure, and has to look like one.
      - name: Require dispatch token
        if: steps.changed.outputs.docs == 'true' || steps.changed.outputs.openapi == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not set — docs.orkestra.cc will not rebuild. Create a fine-grained PAT scoped to orkestra-cc/orkestra-docs (Contents: read and write) and add it as the DOCS_DISPATCH_TOKEN repo secret."
            exit 1
          fi

      - name: Dispatch monorepo-docs-changed
        if: steps.changed.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: gh api repos/orkestra-cc/orkestra-docs/dispatches -f event_type=monorepo-docs-changed

      - name: Dispatch monorepo-openapi-changed
        if: steps.changed.outputs.openapi == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: gh api repos/orkestra-cc/orkestra-docs/dispatches -f event_type=monorepo-openapi-changed
