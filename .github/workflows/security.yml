name: Security Scan

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Reads the shared allowlist (backend/.vulncheck-allowlist.txt) — the
        # SAME source of truth as backend.yml's `make backend-vulncheck` — so
        # the two govulncheck gates can never drift out of sync. See
        # backend/CLAUDE.md for the policy on adding entries.
        run: |
          set +e
          govulncheck -format=json ./... > /tmp/govuln.json
          set -e

          govulncheck ./... || true

          reachable_ids=$(jq -r 'select(.finding != null and (.finding.trace | length) > 0) | .finding.osv' /tmp/govuln.json | sort -u)
          echo "Reachable vulnerability IDs:"
          echo "${reachable_ids:-<none>}"

          allowlist=$(grep -vE '^[[:space:]]*(#|$)' .vulncheck-allowlist.txt | tr '\n' ' ')

          unaccepted=""
          for id in $reachable_ids; do
            case " $allowlist " in
              *" $id "*) ;;
              *) unaccepted="$unaccepted $id" ;;
            esac
          done

          if [ -n "$unaccepted" ]; then
            echo "::error::Unaccepted vulnerabilities reachable from our code:$unaccepted"
            exit 1
          fi
          echo "All reachable vulnerabilities are on the allowlist."

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (runtime deps only — the SPA ships a static bundle)
        run: npm audit --omit=dev --audit-level=high
