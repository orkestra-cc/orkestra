name: Security Scan

# Cost-aware triggers: PRs gate merges, the weekly cron catches newly
# published CVEs (vulnerability exposure changes with time and with
# dependency edits — not with every push). No `push` trigger: a push to
# dev/main would re-scan the exact dependency set the PR just scanned,
# and on the private chain forks every run burns paid minutes. The cron
# additionally runs only where the CI_FULL repo variable is true — the
# fork chain shares one dependency set, so one weekly scan covers it.
on:
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-job path gating. Deliberately NOT `on.pull_request.paths`: a job
  # skipped by this gate still reports a (skipped = satisfied) check, while
  # a workflow filtered out at trigger level never reports and would leave
  # any required status check stuck at "Expected".
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        # schedule/workflow_dispatch bypass the gate entirely (see the
        # `if` on the scan jobs), so the filter only runs on PRs — where
        # it reads the PR file list via API, no checkout needed.
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/security.yml'
            frontend:
              - 'frontend-admin/**'
              - '.github/workflows/security.yml'

  go-vulncheck:
    name: Go Vulnerability Check
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.CI_FULL == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Reads the shared allowlist (backend/.vulncheck-allowlist.txt) — the
        # SAME source of truth as backend.yml's `make backend-vulncheck` — so
        # the two govulncheck gates can never drift out of sync. See
        # backend/CLAUDE.md for the policy on adding entries.
        run: |
          set +e
          govulncheck -format=json ./... > /tmp/govuln.json
          set -e

          govulncheck ./... || true

          reachable_ids=$(jq -r 'select(.finding != null and (.finding.trace | length) > 0) | .finding.osv' /tmp/govuln.json | sort -u)
          echo "Reachable vulnerability IDs:"
          echo "${reachable_ids:-<none>}"

          allowlist=$(grep -vE '^[[:space:]]*(#|$)' .vulncheck-allowlist.txt | tr '\n' ' ')

          unaccepted=""
          for id in $reachable_ids; do
            case " $allowlist " in
              *" $id "*) ;;
              *) unaccepted="$unaccepted $id" ;;
            esac
          done

          if [ -n "$unaccepted" ]; then
            echo "::error::Unaccepted vulnerabilities reachable from our code:$unaccepted"
            exit 1
          fi
          echo "All reachable vulnerabilities are on the allowlist."

  npm-audit:
    name: NPM Security Audit
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.CI_FULL == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (runtime deps only — the SPA ships a static bundle)
        run: npm audit --omit=dev --audit-level=high
