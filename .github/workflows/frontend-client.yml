name: Frontend Client CI

# Tier-2 customer-facing SPA. `make ci-frontend-client` runs lockfile sync,
# typecheck, lint, the Vitest suite (happy-dom + MSW) and the production
# build — the single target the job below invokes.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend-client/**'
      - '.github/workflows/frontend-client.yml'
      - 'Makefile'
      - '.mise.toml'
  push:
    branches: [dev, main]
    # Release tags (vX.Y.Z) build versioned images. paths filters do not
    # apply to tag pushes, so a tag always triggers a full build + publish.
    tags:
      - 'v*'
    paths:
      - 'frontend-client/**'
      - '.github/workflows/frontend-client.yml'
      - 'Makefile'
      - '.mise.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, whatever the repository or a fork sets as the default
# token permissions; a job that publishes widens it in its own permissions block.
permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: Install frontend toolchain only
        run: mise install node
      - name: Install dependencies
        working-directory: frontend-client
        run: npm ci
      - name: Run frontend-client CI (mirrors `make ci-frontend-client` locally)
        run: make ci-frontend-client

  docker:
    name: Docker Build
    needs: ci
    # Publishes only where the CI_FULL repo variable is true (upstream +
    # commons). Product forks default to minimal CI — see AGENTS.md CI/CD.
    if: github.event_name == 'push' && vars.CI_FULL == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/frontend-client
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend-client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the JS bundle by Vite's `define` — the only thing
          # this image needs at build time. Tag pushes bake the semver
          # (`v0.1.4`); branch pushes bake the commit sha.
          build-args: |
            ORKESTRA_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
