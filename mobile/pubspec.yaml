name: orkestra_mobile
description: ORKESTRA Mobile Application - Cross-platform mobile client for the Orkestra management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^3.3.2

  # Networking
  dio: ^5.10.0
  web_socket_channel: ^2.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.1.0

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  # Pinned to ^2.6.1: build_runner 2.15.1 requires analyzer >=8 (Dart SDK
  # 3.10+), but we pin Flutter 3.35 (Dart 3.9.2), where `test` caps analyzer
  # <8 → `flutter pub get` is unresolvable. Dependabot #151 bumped this to
  # 2.15.1 and broke Mobile CI (path-filtered, so it slipped into v0.3.15).
  # Bump only alongside a Flutter/Dart 3.10+ toolchain move.
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section:
  # assets:
  #   - images/

  # To add custom fonts to your application, add a fonts section:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
