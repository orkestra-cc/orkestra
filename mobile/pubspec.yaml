name: orkestra_mobile
description: ORKESTRA Mobile Application - Cross-platform mobile client for the Orkestra management system.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Dart floor is 3.12, not 3.0: flutter_riverpod >=3.4.1 requires it, and the
  # json_annotation/json_serializable pair pulls dart_style >=3.1.6 which needs
  # >=3.10. Stating the real floor makes `pub get` fail fast with a version
  # message instead of resolving to something that breaks at analyze time.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^3.4.2

  # Networking
  dio: ^5.11.0
  web_socket_channel: ^2.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0


  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  # The ^2.6.1 cap existed because build_runner 2.15.1 needs analyzer >=8
  # (Dart SDK 3.10+) while Flutter was pinned at 3.35 / Dart 3.9.2, where
  # `test` caps analyzer <8 and `flutter pub get` became unresolvable —
  # Dependabot #151 bumped it and broke Mobile CI (path-filtered, so it
  # slipped into v0.3.15). **That reason is gone**: the toolchain moved to
  # Flutter 3.44 / Dart 3.12.2, so this may be unpinned whenever Dependabot
  # next proposes it. Left at ^2.6.1 here only to keep the toolchain move
  # from carrying an unrelated dependency bump.
  build_runner: ^2.6.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section:
  # assets:
  #   - images/

  # To add custom fonts to your application, add a fonts section:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
