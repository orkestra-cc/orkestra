# Codex does not read Claude Code's .mcp.json directly. Keep these entries in
# sync with .mcp.json until the clients support a shared project MCP format.
[mcp_servers.dart]
command = "dart"
args = ["mcp-server", "--force-roots-fallback"]

[mcp_servers.integrated-browser-mcp]
command = "sh"
args = ["-lc", "if command -v mise >/dev/null 2>&1; then exec mise exec -- node \"$HOME/.integrated-browser-mcp/mcp-server.mjs\"; else exec node \"$HOME/.integrated-browser-mcp/mcp-server.mjs\"; fi"]
