# Infra services (MongoDB, Redis, RustFS) — one instance per stack.
#
# Host ports bind to INFRA_BIND_ADDRESS (default 127.0.0.1): nothing outside
# the host needs them (RustFS's S3 API is the exception — see below) — the backend reaches every service by name on the
# stack network, and backup.sh / restore.sh / the audit scripts go through
# `docker exec` or that same network. Loopback keeps host-side tooling
# (mongosh, the Go integration tests, openapi-dump.sh) working while a
# published port never crosses to a LAN/public interface, where Docker's
# own iptables chains would bypass the host firewall. Set
# INFRA_BIND_ADDRESS=0.0.0.0 in docker/.env only when a remote host must
# reach the datastore directly.
#
# Every service drops all capabilities and forbids privilege escalation; the
# few caps re-added are the ones each image's entrypoint actually needs.
services:
  mongodb:
    # Pinned to the patch, not the `8.0` line. That tag floats within the LTS
    # series and had already drifted: it resolves to 8.0.29 today while every
    # deployment ran 8.0.23 — and CI, which used the same floating tag, was
    # therefore testing on a different patch than the stacks ran, with nothing
    # saying so. Pinning fixed the drift; the 8.0.23 -> 8.0.29 bump that
    # followed was taken deliberately, as an upgrade rather than a pull.
    # Same-series patch upgrade: FCV stays 8.0 and no data migration runs.
    # Keep this in step with .github/workflows/backend.yml, same patch.
    image: mongo:8.0.29
    container_name: ${APP_NAME}-mongodb-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    # dockerd's inherited soft nofile limit is 1024 (new systemd default);
    # mongod fasserts with EMFILE during recovery on a data dir this size.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # replica-entrypoint.sh writes the keyfile into the mongodb-owned
    # /data/configdb as root before docker-entrypoint.sh chowns /data/* and
    # drops to `mongodb` via gosu — hence DAC_OVERRIDE on top of the usual three.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      # A credential never carries a fallback in these files: an unset value
      # must stop the stack, not quietly become the literal printed in a
      # public repository. `make init` generates every one of them.
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is not set — run make init}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-orkestra}
    entrypoint: ["bash", "/opt/orkestra/replica-entrypoint.sh"]
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./mongo-init/replica-entrypoint.sh:/opt/orkestra/replica-entrypoint.sh:ro
    healthcheck:
      # A ping is insufficient: the app uses MongoDB transactions, which a
      # standalone mongod cannot serve. Initialize the single-node set once,
      # then report healthy only after it is primary. directConnection=true
      # lets both host tests and stack containers connect without depending on
      # the member's advertised hostname.
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'try { if (db.hello().isWritablePrimary) { quit(0); } } catch (error) {} try { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]}); } catch (error) {} quit(1);'"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    # Plain Redis, pinned to the patch. This was redis-stack-server 7.4.7
    # until the `command:` below was examined: overriding the image command
    # drops the stack entrypoint, so no module was ever loaded — `MODULE
    # LIST` on the running 7.4.7 container returned empty. The stack bundle
    # cost 495MB and delivered nothing; this image is 68MB. Redis 8 also
    # folded the Stack modules into core, so there is no redis-stack-server
    # 8.x to move to — 7.4 was the end of that line, which is why the
    # upgrade and the image change are one decision rather than two.
    #
    # SECURITY FLOOR: >= 8.2.6 (or >= 7.4.9 on the old line). Five 2026 CVEs
    # — 2026-23479 and 2026-25243 (both CVSS 7.7, authenticated RCE via the
    # unblock-client flow and via RESTORE), 2026-25588 / 2026-25589 (RESTORE
    # with the TimeSeries and Bloom modules, which Redis 8 carries in core)
    # and 2026-23631 (Lua UAF, replicas only) — are fixed in OSS/CE 6.2.22,
    # 7.2.14, 7.4.9, 8.2.6, 8.4.3 and 8.6.3. The 7.4.7 this replaced sat
    # BELOW that floor and carried the first two; loopback binding plus
    # requirepass were what stood between them and an attacker.
    # https://redis.io/blog/security-advisory-cve202623479-cve202625243-cve-2026-25588-cve202625589-cve-2026-23631/
    #
    # So: a pin is not a security posture. Pinning freezes the version, which
    # is what makes a deploy reproducible AND what silently keeps a known-
    # vulnerable build in service — 7.4.7 was pinned here by digest while
    # 7.4.9 already carried the fixes. Re-check this floor when Redis
    # publishes an advisory, not only when something breaks.
    #
    # Keep the patch in step with .github/workflows/backend.yml and with the
    # Tech Stack tables in CLAUDE.md / backend/CLAUDE.md / backend/README.md
    # / docs/site/intro.mdx, which name this version. The Kubernetes
    # reference deploys plain redis too, so the two now agree.
    image: redis:8.2.9-alpine
    container_name: ${APP_NAME}-redis-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    # --dir /data is load-bearing: overriding the image's command drops the
    # entrypoint that passed it, and redis-server's own default is its cwd
    # (`/`) — outside the volume, so every recreate started with an empty
    # dataset and the volume below held nothing.
    command: redis-server --dir /data --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is not set — run make init}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS — S3-compatible object storage (Apache-2.0, written in Rust).
  # Default backend for user-uploaded blobs (avatars today, future
  # attachments). Speaks the AWS S3 API so the same `internal/shared/blob`
  # store works against RustFS, AWS S3, MinIO, Backblaze B2, etc.
  #
  # Status note: RustFS 1.x is in beta — production-grade single-node
  # mode is fine for avatars (small, regenerable from OAuth fallback);
  # distributed mode is still under testing. Operators running at scale
  # should swap STORAGE_ENDPOINT to a managed S3 in production.
  #
  # Ports: 9100 (S3 API — bumped off the MinIO/Redis-Insight default
  # 9000 to avoid host-port collisions), 9101 (admin console).
  rustfs:
    # Pinned off :latest (which drifted — a newer image 403s on the old
    # /minio/health/live path, marking the container unhealthy). This digest
    # is RustFS v1.0.0-beta.4 and serves /health → 200. Bump deliberately.
    image: rustfs/rustfs@sha256:f7cb98ef492fa3c3ed0dbd65df3ce2dd205c666e24e7d7234d9402c9ed1001f9
    container_name: ${APP_NAME}-rustfs-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # The S3 API is browser-facing when STORAGE_PUBLIC_ENDPOINT routes
      # presigned uploads through the reverse proxy (ADR-0011), so it follows
      # HOST_BIND_ADDRESS like the app ports; the admin console stays internal.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9100}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9101}:9001"
    environment:
      # RustFS documents RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY (the
      # ROOT_USER / ROOT_PASSWORD spellings this file used to set are
      # undocumented aliases). The root pair IS the backend's pair —
      # STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY — unless RUSTFS_ROOT_* override
      # it (scoped backend user, or managed S3 whose credentials the RustFS
      # container must not inherit). One pair to manage on the bundled
      # single-node store, and no literal fallback: the S3 API is browser-
      # facing behind the proxy, so an unset secret stops the stack instead.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY (or RUSTFS_ROOT_USER) is not set — run make init}}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY (or RUSTFS_ROOT_PASSWORD) is not set — run make init}}
    volumes:
      - rustfs-data:/data
    healthcheck:
      # /health returns 200 on this RustFS build; the older MinIO-compat
      # /minio/health/live path now 403s (see the image pin above). A 200
      # means the HTTP surface is up; bucket access is checked by the
      # backend's blob provider (EnsureBucket) on first use.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
