# Infra services (MongoDB, Redis, RustFS) — one instance per stack.
#
# Host ports bind to INFRA_BIND_ADDRESS (default 127.0.0.1): nothing outside
# the host needs them (RustFS's S3 API is the exception — see below) — the backend reaches every service by name on the
# stack network, and backup.sh / restore.sh / the audit scripts go through
# `docker exec` or that same network. Loopback keeps host-side tooling
# (mongosh, the Go integration tests, openapi-dump.sh) working while a
# published port never crosses to a LAN/public interface, where Docker's
# own iptables chains would bypass the host firewall. Set
# INFRA_BIND_ADDRESS=0.0.0.0 in docker/.env only when a remote host must
# reach the datastore directly.
#
# Every service drops all capabilities and forbids privilege escalation; the
# few caps re-added are the ones each image's entrypoint actually needs.
services:
  mongodb:
    image: mongo:8.0
    container_name: ${APP_NAME}-mongodb-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # replica-entrypoint.sh writes the keyfile into the mongodb-owned
    # /data/configdb as root before docker-entrypoint.sh chowns /data/* and
    # drops to `mongodb` via gosu — hence DAC_OVERRIDE on top of the usual three.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-orkestra}
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: ${APP_NAME}-redis-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS — S3-compatible object storage (Apache-2.0, written in Rust).
  # Default backend for user-uploaded blobs (avatars today, future
  # attachments). Speaks the AWS S3 API so the same `internal/shared/blob`
  # store works against RustFS, AWS S3, MinIO, Backblaze B2, etc.
  #
  # Status note: RustFS 1.x is in beta — production-grade single-node
  # mode is fine for avatars (small, regenerable from OAuth fallback);
  # distributed mode is still under testing. Operators running at scale
  # should swap STORAGE_ENDPOINT to a managed S3 in production.
  #
  # Ports: 9100 (S3 API — bumped off the MinIO/Redis-Insight default
  # 9000 to avoid host-port collisions), 9101 (admin console).
  rustfs:
    # Pinned off :latest (which drifted — a newer image 403s on the old
    # /minio/health/live path, marking the container unhealthy). This digest
    # is RustFS v1.0.0-beta.4 and serves /health → 200. Bump deliberately.
    image: rustfs/rustfs@sha256:f7cb98ef492fa3c3ed0dbd65df3ce2dd205c666e24e7d7234d9402c9ed1001f9
    container_name: ${APP_NAME}-rustfs-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # The S3 API is browser-facing when STORAGE_PUBLIC_ENDPOINT routes
      # presigned uploads through the reverse proxy (ADR-0011), so it follows
      # HOST_BIND_ADDRESS like the app ports; the admin console stays internal.
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9100}:9000"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9101}:9001"
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-orkestra}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-changeme-rustfs}
    volumes:
      - rustfs-data:/data
    healthcheck:
      # /health returns 200 on this RustFS build; the older MinIO-compat
      # /minio/health/live path now 403s (see the image pin above). A 200
      # means the HTTP surface is up; bucket access is checked by the
      # backend's blob provider (EnsureBucket) on first use.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
