server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers.
    #
    # ⚠️ nginx does NOT merge add_header across levels: the moment a location
    # declares one of its own, EVERY directive from this block stops applying
    # to it. So each location below that sets any header must re-state the
    # ones it still needs — there is no inheritance to fall back on.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # 0, not "1; mode=block": the legacy XSS auditor this switched on was
    # removed from every current browser, and while it existed it could be
    # abused to selectively suppress scripts and leak cross-origin state.
    # Explicitly off rather than absent, because a legacy browser or proxy may
    # enable it by default. Real defence here is a CSP, which the SPA does not
    # ship yet — deliberately out of scope for a header change.
    add_header X-XSS-Protection "0" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Runtime config — MUST come before the static-asset rule below.
    #
    # config.js is rewritten from ORKESTRA_* env vars by
    # /docker-entrypoint.d/10-write-config.sh on every container start, and
    # index.html loads it from a FIXED url (<script src="/config.js">) with no
    # content hash. It is therefore the one .js file that must never be
    # cached: falling into the `immutable` rule below pinned it for a year,
    # and `immutable` suppresses revalidation even on a normal reload, so a
    # browser that loaded the console once would keep the old apiUrl / wsUrl /
    # env / version until its cache was cleared by hand.
    #
    # An exact-match location outranks the regex one regardless of order, but
    # keep it first for readers. add_header is re-declared here because nginx
    # drops every inherited add_header as soon as a level defines its own.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vite's build output — every file under /assets/ carries a content hash
    # in its name, so a new build produces new urls and these can be cached
    # for a year without revalidation.
    #
    # ^~ makes this prefix win over the regex below, which would otherwise
    # match first. Cache-Control carries the max-age itself (no `expires`, so
    # the response has one Cache-Control header, not two).
    #
    # nosniff is re-stated per the inheritance note above: a mistyped
    # Content-Type on a .js or .css could otherwise be sniffed into something
    # executable. X-Frame-Options and X-XSS-Protection only act on documents,
    # and nothing this location serves is one.
    location ^~ /assets/ {
        # No `always` on Cache-Control: it must NOT ride on the =404 below.
        # A missing bundle during a rolling deploy (new index.html, old node)
        # would otherwise hand the browser a not-found pinned for a year.
        # `always` on nosniff is correct — error bodies want it too.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static files WITHOUT a content hash: /tinymce/* (copied by
    # postinstall.js), /css/*, the favicons. Their url does not change when
    # their content does, so they must not be cached as immutable — a TinyMCE
    # upgrade would otherwise keep the old editor in every browser for a year.
    # no-cache lets the browser keep them but makes it revalidate (ETag /
    # Last-Modified, usually a 304). =404 rather than the SPA fallback, so a
    # missing script is a 404 and not index.html served as JavaScript.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes.
    #
    # index.html must be revalidated on every load: it names the hashed
    # bundles of ONE build. Without a Cache-Control header the browser applies
    # a heuristic freshness lifetime and keeps serving the previous build's
    # index.html after a deploy — whose chunks the new image no longer has
    # (404 on lazy routes). no-cache, not no-store: the browser may keep it,
    # but must ask nginx first (a 304 when nothing changed).
    #
    # Every path that ends in index.html lands here: `/` through the index
    # directive's internal redirect, a deep link through try_files' fallback,
    # /index.html itself. Because this location now declares headers, it
    # re-states the full document set from the server block.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        try_files $uri $uri/ /index.html;
    }
}
