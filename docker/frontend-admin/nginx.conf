server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Runtime config — MUST come before the static-asset rule below.
    #
    # config.js is rewritten from ORKESTRA_* env vars by
    # /docker-entrypoint.d/10-write-config.sh on every container start, and
    # index.html loads it from a FIXED url (<script src="/config.js">) with no
    # content hash. It is therefore the one .js file that must never be
    # cached: falling into the `immutable` rule below pinned it for a year,
    # and `immutable` suppresses revalidation even on a normal reload, so a
    # browser that loaded the console once would keep the old apiUrl / wsUrl /
    # env / version until its cache was cleared by hand.
    #
    # An exact-match location outranks the regex one regardless of order, but
    # keep it first for readers. add_header is re-declared here because nginx
    # drops every inherited add_header as soon as a level defines its own.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets with long cache — safe because Vite content-hashes every
    # emitted bundle, so a new build produces a new url.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
