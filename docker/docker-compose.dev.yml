# ORKESTRA Development Environment Docker Compose
# Local development with hot reload, relaxed security

services:
  backend:
    # Public Alpine dev image by default (no registry auth). A fork with a
    # Chainguard subscription can override the base via the GO_BASE build-arg
    # on Dockerfile.dev-backend.
    build:
      context: .
      dockerfile: Dockerfile.dev-backend
    image: orkestra/dev-backend:latest
    container_name: ${APP_NAME}-backend-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    user: "1000:1000"
    userns_mode: "host"
    working_dir: /app
    restart: unless-stopped
    ports:
      # Bind the browser-facing surfaces to a configurable host address. Local
      # development retains 0.0.0.0 by default; a Tailnet VM can set
      # HOST_BIND_ADDRESS to its Tailscale IP and avoid LAN/public exposure.
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"
    environment:
      ENV: development
      PORT: 3000  # Internal port is always 3000, BACKEND_PORT is for host mapping only

      # MongoDB
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@${MONGO_HOST}:27017/${MONGO_DATABASE:-orkestra}?authSource=admin&replicaSet=rs0&directConnection=true

      # Redis (internal port is always 6379, REDIS_PORT is for host mapping only)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@${REDIS_HOST}:6379/${REDIS_DB:-0}

      # JWT & Auth (RS256 asymmetric keys)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/keys/jwt-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/keys/jwt-public.pem}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-7d}
      AUTH_OPERATOR_PASSWORD_LOGIN_BREAK_GLASS: ${AUTH_OPERATOR_PASSWORD_LOGIN_BREAK_GLASS:-false}

      # OAuth Token Encryption — bootstraps ConfigService (every secret in
      # module_configs is AES-256-GCM encrypted with this key). Rotating it
      # invalidates every stored secret.
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY}

      # Compliance KMS master key (Phase 4.3) — 64 hex chars = 32 bytes.
      # Wraps per-tenant DEKs; losing this key invalidates every wrapped
      # DEK. Keep env-derived so operators can rotate without a rebuild.
      ORKESTRA_KMS_MASTER_KEY: ${ORKESTRA_KMS_MASTER_KEY}

      # Cookie Configuration
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Refresh-cookie name — the only cookie set in the browser (the access
      # token lives in SPA memory, so there is no access-token cookie).
      COOKIE_NAME_REFRESH: ${COOKIE_NAME_REFRESH:-orkestra_cookie}
      # ADR-0003 PR-D D-9: per-audience refresh-cookie domains. Default EMPTY
      # in dev so the cookie is host-only (no Domain attribute), scoped to
      # whatever host minted it — which round-trips on localhost, *.localhost,
      # AND a LAN IP (multi-device testing). A fixed console.localhost/api.localhost
      # default silently broke LAN-IP access: the cookie was never sent back to
      # 192.168.x.x, so every refresh bounced to /login. Set these explicitly
      # only for a cross-subdomain deployment.
      OPERATOR_COOKIE_DOMAIN: ${OPERATOR_COOKIE_DOMAIN:-}
      CLIENT_COOKIE_DOMAIN: ${CLIENT_COOKIE_DOMAIN:-}
      COOKIE_HTTP_ONLY: ${COOKIE_HTTP_ONLY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3000}
      # Per-tier frontend origins for verification + reset email links.
      # Empty falls back to FRONTEND_URL above.
      OPERATOR_FRONTEND_URL: ${OPERATOR_FRONTEND_URL:-}
      CLIENT_FRONTEND_URL: ${CLIENT_FRONTEND_URL:-http://client.localhost:8081}

      # CORS (legacy single-host fallback)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://console.localhost:8080,http://api.localhost:8080}

      # ADR-0003 host split. Defaults use *.localhost so contributors
      # don't need /etc/hosts entries; the host mux also has a dev
      # fallthrough that routes unmatched hosts to the operator mux,
      # so curl http://localhost:3000 still works.
      #
      # The client API answers on the SPA's OWN hostname (client.localhost),
      # not on an api.* label of its own, and that is load-bearing rather
      # than cosmetic. Every client-tier cookie is minted SameSite=Lax with
      # an empty Domain — refresh (password_handler.go:411-424,
      # utils/http.go:53-64), OAuth state (oauth_state_binding.go:56,71),
      # device (middleware/device.go:61-69). `localhost` is not in the
      # Public Suffix List, so Chromium's SchemefulSite falls back to
      # scheme://host: client.localhost and api.localhost are different
      # *sites*, and a cross-site fetch(..., {credentials:'include'}) from
      # the SPA neither stores nor sends those cookies — client login
      # succeeds and the very next refresh 401s. Ports are irrelevant to
      # site, so serving the SPA on :8081 and the client API on :3000 under
      # one hostname is exactly what fixes it; the call is still
      # cross-ORIGIN and still preflighted (CLIENT_CORS_ORIGINS below).
      # Neither cookie knob can substitute: SameSite is computed from the
      # request's site, not the cookie's Domain, and COOKIE_SAME_SITE is
      # read into config but never consumed. The operator console is bound
      # by the same condition and only its DEFAULT satisfies it: the SPA
      # calls VITE_API_URL (below, default http://localhost:3000) with
      # credentials:'include', so it is same-site only while its own origin
      # agrees — both localhost (open it at http://localhost:8080), or both
      # console.localhost (then set VITE_API_URL=http://console.localhost:3000
      # and VITE_ADMIN_ALLOWED_HOSTS=console.localhost). Opening it at
      # console.localhost:8080 against the default reproduces this bug on
      # the operator tier. The shipped convention is localhost end to end
      # (spec §8 follow-up #13) and scripts/env-validate.sh refuses a mixed
      # FRONTEND_URL/VITE_API_URL pairing.
      # The host mux matches a Host header with or without its port
      # (cmd/server/hostmux.go:54-68, :72-84), so the :3000 suffix is fine.
      CONSOLE_HOST: ${CONSOLE_HOST:-console.localhost:3000}
      CLIENT_API_HOST: ${CLIENT_API_HOST:-client.localhost:3000}
      CLIENT_API_URL: ${CLIENT_API_URL:-http://client.localhost:3000}
      OPERATOR_CORS_ORIGINS: ${OPERATOR_CORS_ORIGINS:-}
      # Default CLIENT_CORS_ORIGINS allows the new Tier-2 demo SPA at
      # http://client.localhost:8081 (served by client-frontend).
      # Override in .env to add staging/prod origins.
      CLIENT_CORS_ORIGINS: ${CLIENT_CORS_ORIGINS:-http://client.localhost:8081,http://localhost:8081}

      # Security (relaxed for dev)
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-1000}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-100}
      OPERATOR_RATE_LIMIT_REQUESTS_PER_MINUTE: ${OPERATOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      OPERATOR_RATE_LIMIT_BURST: ${OPERATOR_RATE_LIMIT_BURST:-0}
      CLIENT_RATE_LIMIT_REQUESTS_PER_MINUTE: ${CLIENT_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      CLIENT_RATE_LIMIT_BURST: ${CLIENT_RATE_LIMIT_BURST:-0}

      # Development specific
      DEBUG: "true"
      LOG_LEVEL: debug
      PRETTY_LOGS: "true"

      # Optional Tier-1 log preview. Both are process-owned trusted bases;
      # request data can never select an upstream URL. The observability
      # overlay overrides these while the default app stack leaves them empty.
      LOKI_QUERY_URL: ${LOKI_QUERY_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}

      # Module config (OAuth secrets, Stripe keys, OpenAPI tokens, SMTP,
      # Hindsight URL, Memgraph URI, Gotenberg URL, AI provider keys,
      # per-module enable flags) is owned by ConfigService and edited at
      # /admin/modules. The module ConfigSchema EnvVar fields seed those
      # values from the host environment ONLY on first boot of a brand-new
      # install — after that the module_configs document is authoritative.
      # If you need to bootstrap a fresh deployment from .env, export the
      # seed vars in the shell before running `docker compose up`.

      # Object storage (RustFS — S3-compatible). Backs avatar uploads.
      # Default uses the `rustfs` SERVICE name (resolves on the stack network
      # regardless of APP_NAME/ENV); the old container-name default
      # `orkestra-rustfs` broke once containers became namespaced.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
      # Browser-reachable endpoint baked into presigned PUT/GET URLs. Leave
      # empty for local dev (STORAGE_ENDPOINT is reachable from the host via
      # the /etc/hosts + RUSTFS_API_PORT trick). Set it when RustFS sits behind
      # a public proxy the SPA must reach (e.g. Cloudflare) while the backend
      # keeps using the internal STORAGE_ENDPOINT for its own ops (ADR-0011).
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-orkestra-avatars}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-orkestra}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-changeme-rustfs}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_ENSURE_BUCKET: ${STORAGE_ENSURE_BUCKET:-true}

      # Hot reload
      AIR_BUILD_CMD: go build -o ./tmp/main ./cmd/server
      AIR_BIN: ./tmp/main

      # Go module settings
      GOSUMDB: "off"
      GOMODCACHE: "/app/.go-mod-cache"
      GOCACHE: "/app/.go-build-cache"
      GOBIN: "/app/.go-bin"
      PATH: "/app/.go-bin:/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ../backend:/app
      - ./keys:/app/keys
    # No explicit dns: — inherit the docker daemon's resolvers (matches
    # staging + the public variant). Hardcoding public resolvers (8.8.8.8)
    # loops on `go mod download` where UDP/53 to them is blocked (corporate,
    # hotel WiFi, some ISPs); set the daemon's dns in /etc/docker/daemon.json
    # instead if you need overrides.
    # AIR is pre-baked into Dockerfile.dev-backend, so no runtime `go install`.
    command: ["sh", "-c", "go mod download && air"]

  frontend-admin:
    image: node:24-alpine
    container_name: ${APP_NAME}-frontend-admin-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    user: "1000:1000"
    userns_mode: "host"
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:5173"
    environment:
      NODE_ENV: development
      VITE_ENV: development
      VITE_DEBUG: "true"
      VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-/}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
      # Extra hosts the Vite dev server accepts (DNS-rebinding defence), for
      # LAN/Tailscale access via a hostname. Comma-separated; '*' allows any.
      VITE_ALLOWED_HOSTS: ${VITE_ADMIN_ALLOWED_HOSTS:-}
      # File-watcher override for the Vite dev server. Unset = auto-detect
      # (polling only under a WSL kernel; inotify everywhere else). Set true
      # if hot reload misses edits (repo on /mnt/c), false to force events.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-}
      # Application version surfaced in the SPA footer. orkestra.sh exports
      # this from `git describe`; CI overrides via GITHUB_REF_NAME at
      # image-build time. The container has no git, so this passthrough
      # is how the host's tag reaches Vite's `define` substitution.
      ORKESTRA_VERSION: ${ORKESTRA_VERSION:-dev}
      # Deployment identity surfaced in the SPA footer (bucket A + B).
      # orkestra.sh computes these on the host; the container has no git.
      APP_NAME: ${APP_NAME:-orkestra}
      ORKESTRA_CLONE_VERSION: ${ORKESTRA_CLONE_VERSION:-dev}
      ORKESTRA_BUILD_COMMIT: ${ORKESTRA_BUILD_COMMIT:-}
      NODE_OPTIONS: "--max-old-space-size=4096"
      # npm's cache defaults to ~/.npm in the image FS, which is unwritable
      # under a userns-remap daemon + userns_mode:host (image layers are
      # owned by the remapped range, not the real host UID 1000). Relocate
      # it onto the writable /app bind mount. Mirrors docker-compose.staging.yml.
      npm_config_cache: /app/.npm-cache
    volumes:
      - ../frontend-admin:/app
      - ../frontend-admin/.vite-cache:/app/.vite
      - ../frontend-admin/.npm-cache:/app/.npm-cache
    # Regenerate public/config.js from the VITE_* env vars BEFORE
    # `npm run dev` starts. public/config.js is gitignored (see
    # frontend-admin/.gitignore + frontend-admin/CLAUDE.md → "Runtime
    # config"); each environment writes its own. The dev-default template
    # at public/config.example.js is the fallback when this script can't
    # run (e.g. `npm run dev` directly on the host).
    command:
      - sh
      - -c
      - |
        cat > /app/public/config.js <<EOF
        // Generated at container start by docker-compose.dev.yml.
        // Gitignored — do not commit. See frontend-admin/CLAUDE.md.
        window.__ORKESTRA_CONFIG__ = {
          apiUrl: "$${VITE_API_URL}",
          wsUrl: "$${VITE_WS_URL}",
          env: "$${VITE_ENV}",
          debug: $${VITE_DEBUG},
          version: "$${ORKESTRA_VERSION}",
          appName: "$${APP_NAME}",
          cloneVersion: "$${ORKESTRA_CLONE_VERSION}",
          buildCommit: "$${ORKESTRA_BUILD_COMMIT}",
          startedAt: "$$(date -u +'%Y-%m-%d %H:%MZ')"
        };
        EOF
        npm install && npm run dev -- --host 0.0.0.0

  # Tier-2 (external client) demo SPA — consumes the ADR-0003 client API
  # surface (client.localhost:3000, JWT aud=client). Sibling app to the
  # operator console; lives at frontend-client/. Bind-mounts the source
  # for hot reload, and hits the backend on the SAME hostname it is served
  # on, one port over — the client-tier cookies are SameSite=Lax, and to
  # a browser client.localhost and api.localhost are different sites (see
  # CLIENT_API_HOST above), so an api.* client API cannot carry them.
  #
  # Add to /etc/hosts if your resolver does not answer *.localhost itself:
  #   127.0.0.1 client.localhost
  # (the operator console needs no entry — it is localhost end to end)
  client-frontend:
    image: node:24-alpine
    container_name: ${APP_NAME}-client-frontend-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    user: "1000:1000"
    userns_mode: "host"
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${CLIENT_FRONTEND_PORT:-8081}:5173"
    environment:
      NODE_ENV: development
      # The browser hits the backend directly, so this URL must resolve
      # from the host (not from inside the container network). Keep the
      # hostname equal to the one the SPA is served on (client.localhost)
      # or the SameSite=Lax client cookies are dropped — see
      # CLIENT_API_HOST in the backend service above.
      VITE_API_BASE: ${VITE_CLIENT_API_BASE:-http://client.localhost:3000}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      # Hostnames the Vite dev server accepts (DNS-rebinding defence).
      # Localhost is always allowed; add deployed hostnames here.
      VITE_ALLOWED_HOSTS: ${VITE_CLIENT_ALLOWED_HOSTS:-client.localhost}
      ORKESTRA_VERSION: ${ORKESTRA_VERSION:-dev}
      NODE_OPTIONS: "--max-old-space-size=4096"
      # npm's cache defaults to ~/.npm in the image FS, which is unwritable
      # under a userns-remap daemon + userns_mode:host (image layers are
      # owned by the remapped range, not the real host UID 1000). Relocate
      # it onto the writable /app bind mount. Mirrors docker-compose.staging.yml.
      npm_config_cache: /app/.npm-cache
    volumes:
      - ../frontend-client:/app
      - ../frontend-client/.vite-cache:/app/.vite
      - ../frontend-client/.npm-cache:/app/.npm-cache
    # Regenerate public/config.js from VITE_API_BASE BEFORE `npm run dev`.
    # The SPA reads window.__ORKESTRA_CONFIG__.apiBase (public/config.js) in
    # preference to the build-time VITE_API_BASE, so a deployed host needs
    # this or every browser fetch fails. Mirrors the frontend-admin service;
    # public/config.js is gitignored (template: config.example.js).
    command:
      - sh
      - -c
      - |
        cat > /app/public/config.js <<EOF
        // Generated at container start by docker-compose.dev.yml.
        // Gitignored — do not commit. See frontend-client/CLAUDE.md.
        window.__ORKESTRA_CONFIG__ = {
          apiBase: "$${VITE_API_BASE}",
          stripePublishableKey: "$${VITE_STRIPE_PUBLISHABLE_KEY}"
        };
        EOF
        npm install && npm run dev -- --host 0.0.0.0
    # Probes the in-process /health endpoint registered by the Vite
    # plugin in frontend-client/vite.config.ts. Must use 127.0.0.1, NOT
    # localhost: /etc/hosts maps localhost to ::1 as well, busybox wget
    # tries IPv6 first and does not fall back, while Vite's --host
    # 0.0.0.0 binds IPv4 only — so `localhost` yields connection refused
    # and the container is permanently unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
