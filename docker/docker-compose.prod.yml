# ORKESTRA Production Environment Docker Compose
# Full security, production credentials
#
# Published ports bind to HOST_BIND_ADDRESS, default 127.0.0.1 — closed unless
# docker/.env opens them. A reverse proxy on this VM reaches the services on
# loopback; a proxy on another host needs HOST_BIND_ADDRESS set to the private
# IPv4 it can reach (and a host firewall rule limiting that port to the proxy,
# since a Docker-published port bypasses the host's INPUT chain). The deploy
# gate, scripts/health-check.sh, probes the same address.
#
# Every service drops all capabilities and forbids privilege escalation; the
# backend also runs on a read-only rootfs. frontend-admin stays writable
# because its entrypoint rewrites config.js inside the nginx docroot on start.

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: ${APP_NAME}-backend-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    # The production image runs as its own `nonroot` uid (65532), which cannot
    # read the 0600 JWT private key orkestra.sh enforces on the deploy user's
    # docker/keys/. Run as that user instead — same convention as staging.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # Listens on 3000 and needs no privileged syscall: nothing to re-add.
    cap_drop:
      - ALL
    # The binary writes nothing to its image; everything mutable is a mount.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    environment:
      ENV: production
      PORT: 3000  # Internal port is always 3000, BACKEND_PORT is for host mapping only
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}  # /docs + /openapi.json; default on in dev, off in staging/prod

      # MongoDB (internal port is always 27017, MONGO_PORT is for host mapping only)
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST:-mongodb}:27017/${MONGO_DATABASE}?authSource=admin&replicaSet=rs0&directConnection=true

      # Redis (internal port is always 6379, REDIS_PORT is for host mapping only)
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379/${REDIS_DB:-0}

      # JWT & Auth (RS256 asymmetric keys)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/keys/jwt-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/keys/jwt-public.pem}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-15m}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-7d}

      # OAuth Token Encryption — bootstraps ConfigService (every secret in
      # module_configs is AES-256-GCM encrypted with this key). Rotating it
      # invalidates every stored secret.
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY}

      # Compliance KMS master key (Phase 4.3) — 64 hex chars = 32 bytes.
      # Wraps per-tenant DEKs; losing this key invalidates every wrapped DEK.
      ORKESTRA_KMS_MASTER_KEY: ${ORKESTRA_KMS_MASTER_KEY}

      # Cookie Configuration (maximum security)
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Refresh-cookie name — the only cookie set in the browser (the access
      # token lives in SPA memory, so there is no access-token cookie).
      COOKIE_NAME_REFRESH: ${COOKIE_NAME_REFRESH:-orkestra_cookie}
      # ADR-0003 PR-D D-9: per-audience refresh-cookie scopes. Operators
      # MUST set both — an empty value mints the cookie without a Domain
      # attribute (scoped to the minting host). The host mux already rejects
      # unmatched Host headers with 421, but setting these keeps an operator
      # session from being scoped wider than console.* (and vice-versa).
      OPERATOR_COOKIE_DOMAIN: ${OPERATOR_COOKIE_DOMAIN:-}
      CLIENT_COOKIE_DOMAIN: ${CLIENT_COOKIE_DOMAIN:-}
      COOKIE_HTTP_ONLY: ${COOKIE_HTTP_ONLY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
      # The binary defaults this to true (dev convenience) and refuses to
      # boot in production with it set — so it must be passed explicitly.
      ALLOW_LOCALHOST_REDIRECTS: ${ALLOW_LOCALHOST_REDIRECTS:-false}
      AUTH_OPERATOR_PASSWORD_LOGIN_BREAK_GLASS: ${AUTH_OPERATOR_PASSWORD_LOGIN_BREAK_GLASS:-false}

      # Google OAuth — config.Validate() refuses to boot a production binary
      # without a client id/secret, even though the live values are owned by
      # ConfigService (/admin/modules) and email/password login needs neither.
      # Same placeholder fallback as staging; real values in docker/.env seed
      # the module config on the first boot of a fresh install.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-placeholder.apps.googleusercontent.com}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-placeholder}

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-https://orkestra.cc}
      BACKEND_URL: ${BACKEND_URL:-https://api.orkestra.cc}
      # Per-tier frontend origins for verification + reset email links.
      # Empty falls back to FRONTEND_URL above.
      OPERATOR_FRONTEND_URL: ${OPERATOR_FRONTEND_URL:-}
      CLIENT_FRONTEND_URL: ${CLIENT_FRONTEND_URL:-}

      # ADR-0003 host split. Production has no dev fallthrough — an
      # unmatched Host header returns 421 Misdirected Request, so both
      # CONSOLE_HOST and CLIENT_API_HOST must point at the actual public
      # hostnames behind the ingress.
      CONSOLE_HOST: ${CONSOLE_HOST:-console.orkestra.com}
      CLIENT_API_HOST: ${CLIENT_API_HOST:-api.orkestra.com}
      CLIENT_API_URL: ${CLIENT_API_URL:-}
      OPERATOR_CORS_ORIGINS: ${OPERATOR_CORS_ORIGINS:-}
      CLIENT_CORS_ORIGINS: ${CLIENT_CORS_ORIGINS:-}

      # Trusted proxies — what makes X-Forwarded-For believable.
      #
      # Everything that depends on the caller's address reads the value
      # resolved from this policy: the operator IP allow/blocklist, the
      # login geo-block, the per-IP login rate limiter, and every audited
      # IP. Leave BOTH unset and forwarding headers are ignored entirely
      # — every request is attributed to its direct peer (safe, but wrong
      # behind a proxy: all callers collapse onto the proxy's address and
      # share one rate-limit bucket).
      #
      # Prefer TRUSTED_PROXY_CIDRS (the networks your proxies live in) —
      # it survives a topology change without a recount. Use
      # TRUSTED_PROXY_COUNT when you just know how many hops sit in
      # front. Set this to match YOUR ingress before going live.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}

      # Security (strict)
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-5}
      OPERATOR_RATE_LIMIT_REQUESTS_PER_MINUTE: ${OPERATOR_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      OPERATOR_RATE_LIMIT_BURST: ${OPERATOR_RATE_LIMIT_BURST:-0}
      CLIENT_RATE_LIMIT_REQUESTS_PER_MINUTE: ${CLIENT_RATE_LIMIT_REQUESTS_PER_MINUTE:-0}
      CLIENT_RATE_LIMIT_BURST: ${CLIENT_RATE_LIMIT_BURST:-0}

      # Production specific
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      PRETTY_LOGS: "false"

      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-orkestra-backend}
      # Optional Tier-1 preview URLs. Empty is the fail-closed default;
      # the observability overlay supplies trusted bases when enabled.
      LOKI_QUERY_URL: ${LOKI_QUERY_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}

      # Object storage (RustFS — S3-compatible). Backs avatar uploads.
      # Default uses the `rustfs` SERVICE name (resolves on the stack network
      # regardless of APP_NAME/ENV); the old container-name default
      # `orkestra-rustfs` broke once containers became namespaced. Swap to
      # an AWS S3 endpoint for production-grade managed storage.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://rustfs:9000}
      # Browser-reachable endpoint for presigned URLs when object storage sits
      # behind a public proxy the SPA must reach; backend ops keep using
      # STORAGE_ENDPOINT (ADR-0011 dual-endpoint split). Empty = single-endpoint.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      # Credentials + bucket knobs, same set staging forwards. No insecure
      # fallback for the credentials in production: empty keys keep blob
      # storage disabled (the backend logs it at boot) instead of silently
      # authenticating with the RustFS defaults.
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-orkestra-avatars}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_ENSURE_BUCKET: ${STORAGE_ENSURE_BUCKET:-true}

      # Module config (OAuth, SMTP, AI provider keys, per-module enable flags)
      # is owned by ConfigService and edited at /admin/modules. The module
      # ConfigSchema EnvVar fields seed those values from the host environment
      # ONLY on first boot of a brand-new install — after that the
      # module_configs document is authoritative.
    # Named volumes, not ./backend/* binds: a bind under docker/ shows up as
    # root-owned untracked files in the checkout (and dies with a `git clean`).
    # The Dockerfile pre-creates both mount points world-writable so a
    # fresh volume inherits a directory any uid can write into.
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      - ./keys:/app/keys:ro
    # Note: mongodb and redis are in docker-compose.infra.yml
    # Ensure infra is running: docker compose -f docker-compose.infra.yml up -d
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/3000 && echo 'OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend-admin:
    build:
      context: ../frontend-admin
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.orkestra.cc}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://api.orkestra.cc}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.orkestra.cc/ws}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:-/}
        VITE_ENV: production
        VITE_DEBUG: "false"
        VITE_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
        # Baked into the JS bundle by Vite's `define` at build time.
        # orkestra.sh exports this from `git describe`.
        ORKESTRA_VERSION: ${ORKESTRA_VERSION:-dev}
    # Runtime env consumed by the nginx entrypoint's config.js writer.
    # Runtime (not build-arg) so a redeploy/restart refreshes these without
    # rebuilding the image. apiUrl/wsUrl mirror the build-arg source
    # (VITE_API_URL / VITE_WS_URL) so the runtime config.js — which takes
    # precedence over the Vite-baked fallback in src/config/environment.ts —
    # points at the real API, not the entrypoint's localhost dev default.
    environment:
      ORKESTRA_ENV: production
      ORKESTRA_API_URL: ${VITE_API_URL:-https://api.orkestra.cc}
      ORKESTRA_WS_URL: ${VITE_WS_URL:-wss://api.orkestra.cc/ws}
      ORKESTRA_VERSION: ${ORKESTRA_VERSION:-dev}
      ORKESTRA_APP_NAME: ${APP_NAME:-orkestra}
      ORKESTRA_CLONE_VERSION: ${ORKESTRA_CLONE_VERSION:-dev}
      ORKESTRA_BUILD_COMMIT: ${ORKESTRA_BUILD_COMMIT:-}
    container_name: ${APP_NAME}-frontend-admin-${ENV}
    labels:
      orkestra.stack: ${APP_NAME}-${ENV}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx master runs as root on :80, chowns its temp dirs and drops the
    # workers to the `nginx` user — the four caps that path needs.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend-uploads:
    driver: local
  backend-logs:
    driver: local
